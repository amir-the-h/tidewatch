services:
  iran-watcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: iran-watcher:latest
    container_name: iran-watcher
    restart: unless-stopped

    environment:
      # Required
      IRAN_WATCHER_X_BEARER_TOKEN: "${IRAN_WATCHER_X_BEARER_TOKEN}"

      # Port
      IRAN_WATCHER_API_BIND: "${IRAN_WATCHER_API_BIND:-0.0.0.0:1452}"

      # Redis — point at the service name in your shared network
      IRAN_WATCHER_REDIS_ADDR: "${IRAN_WATCHER_REDIS_ADDR:-redis:6379}"
      IRAN_WATCHER_REDIS_PASSWORD: "${IRAN_WATCHER_REDIS_PASSWORD:-}"
      IRAN_WATCHER_REDIS_DB: "${IRAN_WATCHER_REDIS_DB:-0}"

      # Logging
      IRAN_WATCHER_LOG_FORMAT: "${IRAN_WATCHER_LOG_FORMAT:-json}"
      IRAN_WATCHER_LOG_LEVEL: "${IRAN_WATCHER_LOG_LEVEL:-info}"

      # Ollama
      IRAN_WATCHER_OLLAMA_BASE_URL: "${IRAN_WATCHER_OLLAMA_BASE_URL:-http://ollama:11434}"

      # Optional Pushover notifications
      IRAN_WATCHER_PUSHOVER_APP_TOKEN: "${IRAN_WATCHER_PUSHOVER_APP_TOKEN:-}"
      IRAN_WATCHER_PUSHOVER_USER_KEY: "${IRAN_WATCHER_PUSHOVER_USER_KEY:-}"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    volumes:
      # Persistent SQLite database
      - iran-watcher-data:/data
      - iran-watcher-models:/models
      - iran-watcher-config:/configs

    ports:
      # Bind API only to localhost on the host — not exposed publicly
      - "127.0.0.1:1452:1452"

    networks:
      network:
        ipv4_address: 172.79.0.2
      shared: {}

  iran-watcher-ui:
    build:
      context: ./web
    image: iran-watcher-ui:latest
    container_name: iran-watcher-ui
    restart: unless-stopped
    environment:
      # Empty = same-origin; nginx proxies /api/ to API_UPSTREAM internally.
      API_BASE_URL: "${API_BASE_URL:-}"
      # Backend container reachable via Docker network — never leaves the server.
      API_UPSTREAM: "${API_UPSTREAM:-http://iran-watcher:1452}"
    ports:
      - "127.0.0.1:1453:80"
    networks:
      network:
        ipv4_address: 172.79.0.3
      shared: {}

volumes:
  iran-watcher-data:
  iran-watcher-models:
  iran-watcher-config:

networks:
  network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.79.0.0/16
          gateway: 172.79.0.1
  shared:
    external: true
