services:
  tidewatch:
    build:
      context: .
      dockerfile: Dockerfile
    image: tidewatch:local
    container_name: tidewatch
    restart: unless-stopped

    environment:
      # Port
      TIDEWATCH_API_BIND: "${TIDEWATCH_API_BIND:-0.0.0.0:8080}"

      # Redis — point at the service name in your shared network
      TIDEWATCH_REDIS_ADDR: "${TIDEWATCH_REDIS_ADDR:-tidewatch-redis:6379}"
      TIDEWATCH_REDIS_PASSWORD: "${TIDEWATCH_REDIS_PASSWORD:-}"
      TIDEWATCH_REDIS_DB: "${TIDEWATCH_REDIS_DB:-0}"

      # Logging
      TIDEWATCH_LOG_FORMAT: "${TIDEWATCH_LOG_FORMAT:-json}"
      TIDEWATCH_LOG_LEVEL: "${TIDEWATCH_LOG_LEVEL:-info}"

      # Ollama
      TIDEWATCH_OLLAMA_BASE_URL: "${TIDEWATCH_OLLAMA_BASE_URL:-http://ollama:11434}"

      # Optional Pushover notifications
      TIDEWATCH_PUSHOVER_APP_TOKEN: "${TIDEWATCH_PUSHOVER_APP_TOKEN:-}"
      TIDEWATCH_PUSHOVER_USER_KEY: "${TIDEWATCH_PUSHOVER_USER_KEY:-}"

      # Nominatim reverse geocoding
      TIDEWATCH_NOMINATIM_URL: "${TIDEWATCH_NOMINATIM_URL:-http://nominatim:8080}"

      # Auth — set a strong jwt_secret in production!
      TIDEWATCH_AUTH_JWT_SECRET: "${TIDEWATCH_AUTH_JWT_SECRET:?set TIDEWATCH_AUTH_JWT_SECRET in .env}"
      TIDEWATCH_AUTH_ADMIN_USERNAME: "${TIDEWATCH_AUTH_ADMIN_USERNAME:-admin}"
      TIDEWATCH_AUTH_ADMIN_PASSWORD: "${TIDEWATCH_AUTH_ADMIN_PASSWORD:-changeme}"

    volumes:
      # Persistent SQLite database
      - ./data:/data
      - ./models:/models
      - ./configs:/configs
    depends_on:
      - redis

    networks:
      network:
        ipv4_address: 172.79.0.2

  redis:
    image: redis:7-alpine
    container_name: tidewatch-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    networks:
      network:
        ipv4_address: 172.79.0.4

  nominatim:
    image: mediagis/nominatim:4.4
    container_name: tidewatch-nominatim
    restart: unless-stopped
    shm_size: 1g
    environment:
      PBF_PATH: "/nominatim/pbf/${NOMINATIM_PBF_NAME:-regions.osm.pbf}"
      NOMINATIM_PASSWORD: "nominatim"
    volumes:
      - ./nominatim-data:/var/lib/postgresql/14/main
      - ./nominatim-pbf:/nominatim/pbf
    networks:
      network:
        ipv4_address: 172.79.0.5

  tidewatch-ui:
    build:
      context: ./web
    image: tidewatch-ui:local
    container_name: tidewatch-ui
    restart: unless-stopped
    environment:
      # Empty = same-origin; nginx proxies /api/ to API_UPSTREAM internally.
      API_BASE_URL: "${API_BASE_URL:-}"
      # Backend container reachable via Docker network — never leaves the server.
      API_UPSTREAM: "${API_UPSTREAM:-http://tidewatch:8080}"
      # Initial map view, e.g. MAP_CENTER="32.4,53.7" MAP_ZOOM=5 (default: world view)
      MAP_CENTER: "${MAP_CENTER:-}"
      MAP_ZOOM: "${MAP_ZOOM:-}"
    ports:
      - "${UI_PORT:-3000}:80"
    networks:
      network:
        ipv4_address: 172.79.0.3
    depends_on:
      - tidewatch

  cli:
    image: tidewatch:local
    profiles: ["cli"]
    entrypoint: ["tidewatch"]
    environment:
      TIDEWATCH_BASE_URL: "http://tidewatch:8080"
    volumes:
      - "${HOME}/.tidewatch:/root/.tidewatch"
    networks:
      network:
        ipv4_address: 172.79.0.6

networks:
  network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.79.0.0/16
          gateway: 172.79.0.1
