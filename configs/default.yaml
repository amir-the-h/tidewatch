x:
  tier: basic

redis:
  addr: localhost:6379
  db: 0

sqlite:
  path: ./data/iran-watcher.db

api:
  bind: 127.0.0.1:8080

worker:
  count: 0  # 0 means use number of active models

inference:
  models_dir: ./models

log:
  level: info
  format: text

pushover:
  app_token: ""
  user_key: ""

search:
  enabled: false
  interval: 15m
  max_results: 100
  limit: 0
  tweet_fields:
    - author_id
    - created_at
    - referenced_tweets
    - text
  user_fields:
    - username
  expansions:
    - author_id
    - referenced_tweets.id
  start_time: ""
