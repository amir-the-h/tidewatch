x:
  tier: basic

redis:
  addr: localhost:6379
  db: 0

sqlite:
  path: ./data/tidewatch.db

api:
  bind: 127.0.0.1:8080

worker:
  count: 0  # 0 means use number of active models

sources:
  max_concurrent_polls: 8  # poll-source fetches running at once, across all sources

inference:
  models_dir: ./models
  onnx_lib_path: /usr/local/lib/libonnxruntime.so.1.24.1

log:
  level: info
  format: text

pushover:
  app_token: ""
  user_key: ""

auth:
  # jwt_secret: ""  # REQUIRED — server refuses to start without it; or set TIDEWATCH_AUTH_JWT_SECRET
  admin_username: admin   # initial admin username (used only on first startup)
  admin_password: changeme  # CHANGE THIS — or set TIDEWATCH_AUTH_ADMIN_PASSWORD

ollama:
  # backends:                              # named backends (takes precedence over base_urls/base_url)
  #   - url: http://desktop:11434
  #     name: Desktop
  #   - url: http://macbook:11434
  #     name: MacBook
  # base_url: http://localhost:11434       # single backend (backward-compat)
  # base_urls:                             # pool of backends without names (backward-compat)
  #   - http://desktop:11434
  #   - http://macbook:11434
  # fast_wait_timeout: 5s                  # how long to wait for the fastest backend before falling back

search:
  enabled: false
  interval: 15m
  max_results: 100
  limit: 0
  tweet_fields:
    - author_id
    - created_at
    - referenced_tweets
    - text
  user_fields:
    - username
  expansions:
    - author_id
    - referenced_tweets.id
  start_time: ""

# Twitter OAuth 2.0 PKCE — optional; enables retweet/like/quote actions.
# Register callback_url in the Twitter developer portal.
# twitter:
#   client_id: ""
#   callback_url: "http://localhost:8080/api/twitter/auth/callback"
