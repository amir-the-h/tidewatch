# web/nginx.conf
# This file is treated as a template. ${API_UPSTREAM} is substituted at container
# startup by docker-entrypoint.sh via envsubst. Set API_UPSTREAM env var on the
# container (default: http://iran-watcher:1452).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SSE chat stream — needs a long read timeout and buffering disabled so
    # chunks reach the browser as Ollama produces them. Default proxy_read_timeout
    # is 60s, which is shorter than Ollama's cold-load time on large models.
    location /api/chat/stream {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15m;
        proxy_buffering off;
    }

    # WebSocket upgrade for live event stream.
    location /api/ws {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy API requests to the backend container via Docker network.
    # Stays fully internal — traffic never leaves the server.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: cache static assets aggressively
    location ~* \.(js|css|png|jpg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
