version: 2

# Weekly, grouped updates: one PR per ecosystem for minor/patch bumps, separate PRs
# for majors. Security updates are still raised immediately.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/, /web]
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # CUDA runtime base must match the ONNX Runtime GPU build in the Dockerfile; bump together by hand.
      - dependency-name: nvidia/cuda
