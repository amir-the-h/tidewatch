version: 2

# Weekly, grouped updates: one PR per ecosystem for minor/patch bumps, separate PRs
# for majors. Security updates are still raised immediately.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Must match the ONNX Runtime shared library (ORT_VERSION in Dockerfile, which in turn
      # pins the CUDA base image); bump all three together by hand.
      - dependency-name: github.com/yalue/onnxruntime_go
      # Must match the prebuilt libtokenizers.a (TOKENIZERS_VERSION in Dockerfile and test.yml).
      - dependency-name: github.com/daulet/tokenizers

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (native compiler) has no JS API yet, which vue-tsc requires.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/, /web]
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # CUDA runtime base must match the ONNX Runtime GPU build in the Dockerfile; bump together by hand.
      - dependency-name: nvidia/cuda
